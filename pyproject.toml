[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "monte-carlo-carrier-scattering"
version = "0.2.0"
description = "Monte Carlo relaxation in parabolic semiconductor valleys"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.scripts]
carrier-sim = "carrier_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
